<div class="registration-container">
  @switch (view) {
    @case ('checking') {
      <div class="busy-message" aria-busy="true">Laden …</div>
    }
    @case ('masterkey') {
      <app-master-key-setup (createClicked)="onCreateMasterKey()"></app-master-key-setup>
    }
    @case ('busy') {
      <div class="busy-message">Wahlschein wird erstellt …</div>
    }
    @case ('error') {
      <div class="error-display">{{ error }}</div>
    }
    @case ('registrationClosed') {
      <div class="error-display">{{ error }}</div>
      <button type="button" class="ok-button" (click)="goHome()">OK</button>
    }
  }
</div>
