@if(!(masterKey$ | async)) {
  <app-masterkey-options 
  [canSkip]="false"
  (createMasterKeyClicked)="onCreateMasterKey()"
  (importMasterKeyClicked)="onImportMasterKey()"
  ></app-masterkey-options>
}
@else {
  @if ((validElection$ | async)) {
    <p>Registration successful!</p>
  } @else {
    <p>Invalid election ID.</p>
  }
}
