<div class="registration-container">
  @switch (view) {
    @case ('checking') {
      <div class="busy-message" aria-busy="true">{{ 'common.loading' | translate }}</div>
    }
    @case ('masterkey') {
      <app-master-key-setup (createClicked)="onCreateMasterKey()"></app-master-key-setup>
    }
    @case ('authorizing') {
      <div class="ap-auth-overlay" role="status" aria-live="polite">
        <div class="ap-auth-overlay__card">{{ apAuthOverlayText }}</div>
      </div>
    }
    @case ('busy') {
      <div class="busy-message">{{ 'registration.creatingBallot' | translate }}</div>
    }
    @case ('error') {
      <div class="error-display">{{ error }}</div>
    }
    @case ('registrationClosed') {
      <div class="error-display">{{ error }}</div>
      <button type="button" class="ok-button" (click)="goHome()">{{ 'common.ok' | translate }}</button>
    }
  }
</div>
