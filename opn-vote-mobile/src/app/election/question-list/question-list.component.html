<div class="question-list-container">
  @for (question of questions; track question.key; let last = $last) {
    <app-question
      [question]="question"
      [initialVote]="initialVotes[question.key]"
      (optionSelected)="optionSelected.emit({ key: question.key, selected: $event })"
    ></app-question>
    @if (!last) {
      <app-line width="100%" height="1px"color="white" margin="0 auto 18px auto"></app-line>
    }
  }
</div>
