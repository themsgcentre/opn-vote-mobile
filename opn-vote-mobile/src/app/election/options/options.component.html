<div class="options-container">
  @for (option of options; track option.voteOption; let i = $index) {
    <label
      class="option-card"
      [class.selected]="selectedOption?.voteOption === option.voteOption"
      [class.approve]="isApprove(option)"
      [class.reject]="isReject(option)"
      [class.abstain]="isAbstain(option)"
    >
      <input
        type="radio"
        [name]="groupname"
        [(ngModel)]="selectedOption"
        [value]="option"
        (ngModelChange)="onBallotSelected($event)"
      >

      <span class="option-icon">
        @if (selectedOption?.voteOption === option.voteOption) {
          @if (isApprove(option)) {
            <i class="bi bi-check-lg icon-mark approve" aria-hidden="true"></i>
          }
          @else if (isReject(option)) {
            <i class="bi bi-x-lg icon-mark"  aria-hidden="true"></i>
          }
          @else if (isAbstain(option)) {
            <i class="bi bi-slash-lg icon-mark" aria-hidden="true"></i>
          }
        }
      </span>

      <span class="option-text">{{ option.text }}</span>
    </label>
  }
</div>
