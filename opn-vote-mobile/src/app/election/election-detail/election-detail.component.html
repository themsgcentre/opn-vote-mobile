@if(election) {
  <div class="info-container">
    <div class="title">{{election.title}}</div>
    <div class="image-container">
        <app-election-image></app-election-image>
    </div>
    <div class="vote-count">Bisherige Stimmen: {{election.numberOfVotes}}</div>
    <div class="endDate">Tage verbleibend: {{daysTilEnd}}</div>
    <div class="vote-button">Jetzt an Wahl teilnehmen</div>
  </div>
}
