<div class="info-container">
  <div class="category-display">{{category}}</div>
  <div class="title">{{title}}</div>
  <div class="bottom-row">
    <app-number-display
      description="Abgestimmt"
      [numericValue]="numberOfVotes"
    ></app-number-display>
    <app-line
      height="54px"
      width="1px"
    ></app-line>
    <app-number-display
      description="Tage verbleibend"
      [numericValue]="daysTilEnd"
    ></app-number-display>
  </div>
</div>
