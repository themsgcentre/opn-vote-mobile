<div class="qr-scan-backdrop" role="dialog" aria-modal="true" aria-labelledby="qr-scan-title">
  <div class="qr-scan-panel">
    <div id="qr-scan-title" class="qr-scan-title">{{ 'qrScan.title' | translate }}</div>
    <p class="qr-scan-hint">{{ 'qrScan.hint' | translate }}</p>
    @if (cameraError) {
      <p class="qr-scan-error">{{ cameraError }}</p>
    } @else {
      <div class="qr-reader-wrap">
        <div [id]="readerElementId" class="qr-reader-host"></div>
      </div>
    }
    <button type="button" class="qr-scan-cancel" (click)="onCancelClick()">
      {{ 'common.cancel' | translate }}
    </button>
  </div>
</div>
