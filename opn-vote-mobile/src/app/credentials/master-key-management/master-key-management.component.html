<div class="masterkey-container">
  <div class="section-title">
    <span class="title-with-icon">
      <i class="bi bi-key-fill"></i>
      <span>Masterkey</span>
      <i
        class="bi bi-question-circle-fill info-icon"
        (click)="openInfoPopup.emit()"
      ></i>
    </span>
  </div>

  @if (importError) {
    <div class="import-feedback import-feedback--error" role="alert">
      {{ importError }}
    </div>
  }

  @if ((hasMasterKey$ | async) === false) {
    <app-master-key-setup 
      (createClicked)="onCreateMasterKey()"
      (importClicked)="onImportMasterKey()"
    ></app-master-key-setup>
  } @else {
    <div class="section-description">
      Sie haben bereits einen Masterkey erstellt.
    </div>

    <div class="button-group">
      <div class="action-button primary" (click)="onExportMasterKey()">
        Masterkey exportieren
      </div>

      <div class="action-button danger" (click)="confirmDialog = true">
        Masterkey löschen
      </div>
    </div>
  }
</div>

@if (importDialogOpened) {
  <app-import-dialog item="Masterschlüssel" (scanSelected)="importViaScan()" (uploadSelected)="importViaUpload()"></app-import-dialog>
}
@if (qrScanOpened) {
  <app-qr-scan-dialog (scanSuccess)="onQrScanSuccess($event)" (cancel)="onQrScanCancel()"></app-qr-scan-dialog>
}
@if(scanSuccess) {
  <app-message-dialog
    title="Masterkey Import"
    message="Import erfolgreich!"
    (okClicked)="closeMessage()"
  ></app-message-dialog>
}

@if(confirmDialog) {
  <app-question-dialog
    title="Masterschlüssel löschen"
    question="Masterschlüssel wirklich löschen? Diese Aktion kann nicht rückgängig gemacht werden."
    (yesClicked)="onDeleteMasterKey()"
    (noClicked)="confirmDialog = false"
  ></app-question-dialog>
}
