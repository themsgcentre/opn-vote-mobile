<div class="masterkey-container">
  <div class="section-title">
    <span class="title-with-icon">
      <i class="bi bi-key-fill"></i>
      <span>Masterkey</span>
      <i
        class="bi bi-question-circle-fill info-icon"
        (click)="infoClicked.emit()"
      ></i>
    </span>
  </div>

  @if (importError) {
    <div class="import-feedback import-feedback--error" role="alert">
      {{ importError }}
    </div>
  }

  @if (state === 'loading') {
    <div class="section-description">Laden …</div>
  }
  @if (state === 'none') {
    <app-master-key-setup
      (createClicked)="createClicked.emit()"
      (importClicked)="importClicked.emit()"
    ></app-master-key-setup>
  }
  @if (state === 'present') {
    <div class="section-description">
      Sie haben bereits einen Masterkey erstellt.
    </div>

    <div class="button-group">
      <div class="action-button primary" (click)="exportClicked.emit()">
        Masterkey exportieren
      </div>

      <div class="action-button danger" (click)="deleteClicked.emit()">
        Masterkey löschen
      </div>
    </div>
  }
</div>
