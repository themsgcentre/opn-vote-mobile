<div class="masterkey-setup-container">
  <div class="title">Masterschlüssel erstellen</div>
  <div class="description"> Du hast noch keinen keinen Masterschlüssel. Bitte wähle aus folgenden Optionen aus: </div>
  <div class="options-container">
    <div 
      class="create-button" 
      (click)="onCreateMasterKey()">
      Jetzt Masterschlüssel erstellen
    </div>
    <div class="or-text">oder</div>
    <div 
      class="import-button" 
      (click)="onImportMasterKey()">
      Masterschlüssel importieren
    </div>
  </div>
  @if (canSkip) {
    <div class="skip-text">Überspringen</div>
  }
</div>
