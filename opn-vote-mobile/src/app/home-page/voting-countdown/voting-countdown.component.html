@if (showCountdown && state !== 'none') {
  <div class="countdown-strip" aria-live="polite">
    @if (state === 'countdown') {
      <span class="countdown-label">Abstimmung beginnt in</span>
      <span class="countdown-value">{{ countdownText }}</span>
    }
    @if (state === 'open') {
      <span class="countdown-open">Jetzt abstimmen!</span>
    }
  </div>
}
