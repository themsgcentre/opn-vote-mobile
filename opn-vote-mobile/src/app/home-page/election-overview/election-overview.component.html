@if(election) {
  <div class="election-block">
    <div class="country-display">{{election.country}}</div>
    <div class="image-container">
      <app-election-image></app-election-image>
    </div>
    <div class="election-info">
      <app-election-info
        [category]="election.category"
        [title]="election.title"
        [daysTilEnd]="daysTilEnd"
        [numberOfVotes]="election.numberOfVotes"
      ></app-election-info>
    </div>
  </div>
}
