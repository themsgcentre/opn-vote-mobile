@if (election) {
  <div class="election-block">

    <div class="title-bar">
      {{ election.title }}
    </div>

    <div class="image-container">
      <app-election-image
        [small]="election.headerImage.small"
        [large]="election.headerImage.large"
        [takeLarge]="false"
        [alt]="election.title">
      </app-election-image>
    </div>

  </div>
}
