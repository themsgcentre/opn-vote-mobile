<ion-content>
  <div class="page-container">
    <div class="tabs-container">
      <button
        class="tab-button"
        [class.active]="selectedTab === 'upcoming'"
        (click)="selectTab('upcoming')"
      >
        {{ 'homePage.tabs.upcoming' | translate }}
      </button>

      <button
        class="tab-button"
        [class.active]="selectedTab === 'pending'"
        (click)="selectTab('pending')"
      >
        {{ 'homePage.tabs.pending' | translate }}
      </button>

      <button
        class="tab-button"
        [class.active]="selectedTab === 'running'"
        (click)="selectTab('running')"
      >
        {{ 'homePage.tabs.running' | translate }}
      </button>

      <button
        class="tab-button"
        [class.active]="selectedTab === 'finished'"
        (click)="selectTab('finished')"
      >
        {{ 'homePage.tabs.finished' | translate }}
      </button>
    </div>

    <div class="search-container">
      <i class="bi bi-search search-icon"></i>
      <input
        type="text"
        class="search-input"
        [placeholder]="'homePage.searchPlaceholder' | translate"
        [value]="searchTerm"
        (input)="onSearchChange($event)"
      />
    </div>

    <div class="list-container">
      <app-election-list
        [elections]="filteredElections"
        [showVotingCountdown]="false"
        (electionClicked)="navigateToElection($event)"
      ></app-election-list>
    </div>
  </div>
</ion-content>
