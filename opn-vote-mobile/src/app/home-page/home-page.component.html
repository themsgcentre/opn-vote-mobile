<ion-content>
  <div class="page-container">
    <div class="tabs-container">
      <button
        class="tab-button"
        [class.active]="selectedTab === 'upcoming'"
        (click)="selectTab('upcoming')"
      >
        anstehend
      </button>

      <button
        class="tab-button"
        [class.active]="selectedTab === 'pending'"
        (click)="selectTab('pending')"
      >
        Registrierung zu
      </button>

      <button
        class="tab-button"
        [class.active]="selectedTab === 'running'"
        (click)="selectTab('running')"
      >
        laufend
      </button>

      <button
        class="tab-button"
        [class.active]="selectedTab === 'finished'"
        (click)="selectTab('finished')"
      >
        abgeschlossen
      </button>
    </div>

    <div class="search-container">
      <i class="bi bi-search search-icon"></i>
      <input
        type="text"
        class="search-input"
        placeholder="Wahl suchen"
        [value]="searchTerm"
        (input)="onSearchChange($event)"
      />
    </div>

    <div class="list-container">
      <app-election-list
        [elections]="filteredElections"
        (electionClicked)="navigateToElection($event)"
      ></app-election-list>
    </div>
  </div>
</ion-content>
