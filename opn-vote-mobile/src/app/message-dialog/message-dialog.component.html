<div class="message-backdrop" role="dialog" aria-modal="true" aria-labelledby="message-title">
  <div class="message-dialog">
    <div id="message-title" class="message-title">{{ title }}</div>
    <div class="message-text">{{ message }}</div>
    @if (linkUrl) {
      <a
        class="message-link"
        [href]="linkUrl"
        target="_blank"
        rel="noopener noreferrer"
      >{{ linkLabel || linkUrl }}</a>
    }
    <button type="button" class="button" (click)="okClicked.emit()">Okay</button>
  </div>
</div>
